server:
  port: 8086
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://${RDS_ENDPOINT:localhost}:${RDS_PORT:3306}/user_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&socketTimeout=5000
    username: ${RDS_USERNAME:root}
    password: ${RDS_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 600000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}

jwt:
  secret: ${JWT_SECRET:foodchain-super-secret-key-change-in-production-32chars}
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  oauth2:
    enabled: false

logging:
  level:
    root: INFO
    com.microservices: DEBUG
