server:
  port: 8086
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://${RDS_ENDPOINT:localhost}:${RDS_PORT:3306}/user_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&socketTimeout=5000
    username: ${RDS_USERNAME:root}
    password: ${RDS_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 600000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USER:}
    password: ${EMAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET:foodchain-super-secret-key-change-in-production-32chars}
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

app:
  kafka:
    topic-email-send: ${KAFKA_TOPIC_EMAIL_SEND:notification.email.send}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${EMAIL_USER:}
  oauth2:
    enabled: false

logging:
  level:
    root: INFO
    com.microservices: DEBUG
