server:
  port: 8083
  servlet:
    context-path: /api

app:
  branch-service:
    url: ${BRANCH_SERVICE_URL:http://branch-service:8081}

spring:
  datasource:
    url: jdbc:mysql://${RDS_ENDPOINT:localhost}:${RDS_PORT:3306}/order_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${RDS_USERNAME:root}
    password: ${RDS_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    topic:
      order-received: order.received
      order-status-updated: order.status.updated

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:}
  public-key: ${PAYSTACK_PUBLIC_KEY:}
  base-url: https://api.paystack.co
  callback-url: ${PAYSTACK_CALLBACK_URL:https://foodchain.live/payment/callback}

logging:
  level:
    root: INFO
    com.microservices: DEBUG
