server:
  port: 8083
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://${RDS_ENDPOINT:localhost}:${RDS_PORT:3306}/order_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${RDS_USERNAME:root}
    password: ${RDS_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    topic:
      order-received: order.received
      order-status-updated: order.status.updated

app:
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:}
    currency: ${PAYSTACK_CURRENCY:NGN}
    callback-url: ${PAYSTACK_CALLBACK_URL:http://localhost:5173/checkout/payment/callback}
    default-online-checkout: ${PAYSTACK_DEFAULT_ONLINE:true}
    webhook-enabled: ${PAYSTACK_WEBHOOK_ENABLED:false}
  kafka:
    topic-email-send: ${KAFKA_TOPIC_EMAIL_SEND:notification.email.send}

logging:
  level:
    root: INFO
    com.microservices: DEBUG
